version: '3'

vars:
  APP_NAME: "screenpear"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation.
  GOOS: '{{.GOOS | default OS}}'
  WAILS_VERSION: "v3.0.0-alpha2.117"
  # Semantic version for artifact filenames. CI passes VERSION=x.y.z.
  VERSION: '{{.VERSION | default "0.0.0-dev"}}'
  # <RFC3339 UTC>-<6-char sha>, linked into main.version so any artifact
  # traces back to an exact commit and moment.
  BUILD_VERSION:
    sh: |-
      echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)-$(git rev-parse --short=6 HEAD 2>/dev/null || echo nogit)"
  LDFLAGS_X: '-X main.version={{.BUILD_VERSION}}'

# Remembered phone/identity for `task ios:iphone` (written by that task,
# gitignored). Task only allows dotenv in the root Taskfile.
dotenv: ['.ios-device.env']

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  macos-swiftui: ./build/macos-swiftui/Taskfile.yml
  ios: ./build/ios-swiftui/Taskfile.yml

tasks:
  setup:
    desc: Install the wails3 CLI pinned to the version this project was scaffolded with
    run: once
    cmds:
      - CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@{{.WAILS_VERSION}}
    status:
      - wails3 version | grep -q "{{.WAILS_VERSION}}"

  # ─── Primary workflows ────────────────────────────────────────

  dev:
    desc: Hot-reload development
    deps: [setup]
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:
    desc: Build for the current platform -> bin/screenpear
    deps: [setup]
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    desc: Package a production build (.app / AppImage+deb+rpm / NSIS)
    deps: [setup]
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    desc: Run the built application
    cmds:
      - task: "{{.GOOS}}:run"

  bindings:
    desc: Regenerate the TypeScript bindings from the Go services
    deps: [setup]
    cmds:
      - task: common:generate:bindings

  # ─── Tests ────────────────────────────────────────────────────
  #
  #   task test            — unit + e2e (no GUI, no device)
  #   task test:unit       — hermetic unit tests only
  #   task test:e2e        — OCR pipeline over fixtures
  #   task test:gui        — Linux xdotool window test
  #   task test:gowda      — macOS SwiftUI via WDA
  #   task test:ios        — iOS simulator

  test:
    desc: Run unit + e2e tests
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Hermetic unit tests (no OCR models, no GUI toolkit)
    cmds:
      - CGO_ENABLED=0 go test ./internal/... ./services/... -count=1

  test:e2e:
    desc: OCR + mask over test/testdata fixtures (downloads models on first run)
    cmds:
      - SCREENPEAR_E2E=1 go test -v -count=1 -timeout 600s ./test/e2e/

  test:gui:
    desc: Launch binary, drive via loopback API + xdotool screenshots (Linux/X11)
    deps: [build]
    cmds:
      - SCREENPEAR_E2E=1 go test -v -count=1 -tags gui -timeout 300s ./test/e2e/

  test:gowda:
    desc: Drive macOS SwiftUI window via WDA/gowda (needs WDA + running app)
    cmds:
      - SCREENPEAR_E2E=1 go test -v -count=1 -tags gowda -timeout 600s ./test/e2e/

  test:ios:
    desc: Build iOS app, launch in simulator, screenshot each step
    cmds:
      - SCREENPEAR_E2E=1 go test -v -count=1 -timeout 600s -run TestIOS ./test/e2e/

  # ─── Utilities ────────────────────────────────────────────────

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}} frontend/dist .task

  doctor:
    desc: Verify development dependencies
    deps: [setup]
    cmds:
      - wails3 doctor

  setup:docker:
    desc: Build the Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
